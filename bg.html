<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e0e14; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const TILE = 32, COLS = 25, ROWS = 25;
  const W = COLS * TILE, H = ROWS * TILE;
  const c = document.getElementById('c');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  let seed = 9001;
  const rnd = () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  // ── maze gen ───────────────────────────────────────────────────────────────
  const grid = Array.from({ length: ROWS }, () => new Uint8Array(COLS).fill(1));
  const stack = [[1, 1]];
  grid[1][1] = 0;
  const dirs = [[-2, 0], [2, 0], [0, -2], [0, 2]];

  while (stack.length) {
    const [r, cc] = stack[stack.length - 1];
    const neighbors = [];
    for (const [dr, dc] of dirs) {
      const nr = r + dr, nc = cc + dc;
      if (nr > 0 && nr < ROWS - 1 && nc > 0 && nc < COLS - 1 && grid[nr][nc] === 1) {
        neighbors.push([nr, nc, r + dr / 2, cc + dc / 2]);
      }
    }
    if (neighbors.length) {
      const [nr, nc, wr, wc] = neighbors[Math.floor(rnd() * neighbors.length)];
      grid[wr][wc] = 0;
      grid[nr][nc] = 0;
      stack.push([nr, nc]);
    } else {
      stack.pop();
    }
  }

  for (let r = 1; r < ROWS - 1; r++) {
    for (let cc = 1; cc < COLS - 1; cc++) {
      if (grid[r][cc] === 1 && rnd() < 0.22) grid[r][cc] = 0;
    }
  }

  // ── render ─────────────────────────────────────────────────────────────────
  // floor — mid-dark so the corridors read clearly once blurred
  g.fillStyle = '#23262f';
  g.fillRect(0, 0, W, H);

  for (let i = 0; i < 500; i++) {
    const x = rnd() * W, y = rnd() * H;
    const a = 0.02 + rnd() * 0.05;
    g.fillStyle = rnd() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`;
    g.fillRect(x, y, 2 + rnd() * 5, 2 + rnd() * 5);
  }

  // walls — noticeably lighter than the floor
  for (let r = 0; r < ROWS; r++) {
    for (let cc = 0; cc < COLS; cc++) {
      if (grid[r][cc] !== 1) continue;
      const x = cc * TILE, y = r * TILE;

      const v = Math.floor(rnd() * 4);
      const L = 34 + v * 5;                       // 34–49 % lightness
      g.fillStyle = `hsl(${228 + v * 3}, 10%, ${L}%)`;
      g.fillRect(x, y, TILE, TILE);

      // bevel highlight / shade
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.fillRect(x, y, TILE, 2);
      g.fillRect(x, y, 2, TILE);
      g.fillStyle = 'rgba(0,0,0,0.34)';
      g.fillRect(x, y + TILE - 2, TILE, 2);
      g.fillRect(x + TILE - 2, y, 2, TILE);

      // mortar
      g.strokeStyle = 'rgba(0,0,0,0.42)';
      g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);

      // speckle
      for (let i = 0; i < 6; i++) {
        g.fillStyle = `rgba(255,255,255,${0.03 + rnd() * 0.06})`;
        g.fillRect(x + rnd() * TILE, y + rnd() * TILE, 1 + rnd() * 2, 1);
      }

      // moss
      if (v % 3 === 0) {
        for (let i = 0; i < 4; i++) {
          g.fillStyle = `rgba(96,150,86,${0.10 + rnd() * 0.14})`;
          g.beginPath();
          g.arc(x + rnd() * TILE, y + rnd() * TILE, 2 + rnd() * 4, 0, Math.PI * 2);
          g.fill();
        }
      }
    }
  }

  // gentle vignette
  const vig = g.createRadialGradient(W / 2, H / 2, W * 0.30, W / 2, H / 2, W * 0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = vig;
  g.fillRect(0, 0, W, H);
})();
</script>
</body>
</html>
